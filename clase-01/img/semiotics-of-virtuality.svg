<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Semiotics of Virtuality</title>
  <desc id="desc">Diagram of the semiotics of virtuality with materiality, information, mutation, hyperreality, presence, absence, randomness and pattern.</desc>
  <rect width="1200" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#000000">
    <text x="600" y="56" text-anchor="middle" font-size="37" font-style="italic">Materiality</text>
    <text x="600" y="875" text-anchor="middle" font-size="37" font-style="italic">Information</text>
    <text x="128" y="470" text-anchor="middle" font-size="37" font-style="italic">Mutation</text>
    <text x="1068" y="470" text-anchor="middle" font-size="37" font-style="italic">Hyperreality</text>

    <text x="350" y="250" text-anchor="middle" font-size="34">Presence</text>
    <text x="850" y="250" text-anchor="middle" font-size="34">Absence</text>
    <text x="350" y="682" text-anchor="middle" font-size="34">Randomness</text>
    <text x="850" y="682" text-anchor="middle" font-size="34">Pattern</text>
  </g>

  <g stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="75" y1="340" x2="420" y2="40"/>
    <line x1="1125" y1="340" x2="780" y2="40"/>
    <line x1="75" y1="555" x2="420" y2="855"/>
    <line x1="1125" y1="555" x2="780" y2="855"/>
  </g>

  <g stroke="#000000" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <line x1="415" y1="285" x2="785" y2="285" stroke-dasharray="18 18"/>
    <line x1="785" y1="615" x2="415" y2="615" stroke-dasharray="18 18"/>

    <line x1="410" y1="310" x2="790" y2="610"/>
    <line x1="790" y1="310" x2="410" y2="610"/>

    <line x1="415" y1="330" x2="415" y2="580"/>
    <line x1="785" y1="330" x2="785" y2="580"/>
  </g>
</svg>
